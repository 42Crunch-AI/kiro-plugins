name: upstream-sync

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 42Crunch-AI/copilot-plugins
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Kiro plugin matches the Copilot plugin
        run: python3 tools/sync_from_upstream.py --upstream upstream --check

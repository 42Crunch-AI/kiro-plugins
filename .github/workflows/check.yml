name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the plugin is built and valid
        run: python3 tools/build.py --check
